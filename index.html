<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新能源产业数据看板</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="brand">E<span>.</span>Dashboard</a>
    <a href="index.html" class="nav-link active">概览</a>
    <a href="nev.html" class="nav-link">新能源汽车</a>
    <a href="battery.html" class="nav-link">动力电池</a>
    <a href="pv.html" class="nav-link">光伏</a>
    <a href="h2.html" class="nav-link">氢能</a>
    <div class="nav-spacer"></div>
    <button class="theme-toggle" id="theme-toggle" title="切换主题">☀️</button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>产业数据概览</h1>
    <p id="update-info">加载中…</p>
  </div>

  <div class="metrics-grid" id="metrics-grid">
    <div class="metric-card"><div class="label">加载中</div><div class="value">—</div></div>
    <div class="metric-card"><div class="label">加载中</div><div class="value">—</div></div>
    <div class="metric-card"><div class="label">加载中</div><div class="value">—</div></div>
    <div class="metric-card"><div class="label">加载中</div><div class="value">—</div></div>
  </div>

  <div class="section-title">产业板块</div>
  <div class="industry-grid" id="industry-grid"></div>

  <div class="section-title">近期行业动态</div>
  <div class="timeline" id="timeline">
    <div class="loading-text">加载中…</div>
  </div>
</div>

<script src="theme.js"></script>
<script>
(function () {
  var industryNames = { H2: '氢能', NEV: '新能源汽车', BATTERY: '动力电池', PV: '光伏' };
  var industryIcons = { H2: '🟢', NEV: '🚗', BATTERY: '🔋', PV: '☀️' };
  var industryLinks = { H2: 'h2.html', NEV: 'nev.html', BATTERY: 'battery.html', PV: 'pv.html' };
  var industryDesc = {
    NEV: '厂商销量排名 · 月度趋势 · 车型 TOP20',
    BATTERY: '产量/装车量趋势 · 三元 vs 铁锂份额',
    PV: '硅料/硅片/电池片/组件 · 周度价格走势',
    H2: '项目库 · 电解槽招标成本 · 政策追踪'
  };

  function fmtNum(n) {
    if (n >= 1e8) return (n / 1e8).toFixed(1) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
    return n.toLocaleString('zh-CN');
  }
  function fmtMonth(m) {
    if (!m) return ''; var p = m.split('-');
    return p[0] + '年' + parseInt(p[1], 10) + '月';
  }

  Promise.all([
    fetch('data/overview.json').then(function (r) { return r.json(); }),
    fetch('data/meta.json').then(function (r) { return r.json(); })
  ]).then(function (res) {
    var ov = res[0], meta = res[1];
    renderMetrics(ov);
    renderIndustry(meta, ov);
    renderTimeline(ov.recent_events);
    document.getElementById('update-info').textContent =
      '数据更新至 ' + (meta.export_date || '').slice(0, 10);
  }).catch(function (e) {
    document.getElementById('update-info').textContent = '加载失败: ' + e.message;
  });

  function renderMetrics(d) {
    var cards = [];
    var nev = d.nev_monthly;
    if (nev && nev[0]) {
      var mom = nev[1] ? ((nev[0].total_volume - nev[1].total_volume) / nev[1].total_volume * 100) : null;
      cards.push({ label: 'NEV 批发总量 · ' + fmtMonth(nev[0].record_date),
        value: fmtNum(nev[0].total_volume) + ' 辆',
        sub: mom !== null ? (mom >= 0 ? '↑' : '↓') + ' 环比 ' + Math.abs(mom).toFixed(1) + '%' : '',
        trend: mom >= 0 ? 'up' : 'down' });
    }
    var bat = d.battery_trend;
    if (bat) {
      var prod = bat.filter(function (r) { return r.subcategory === '动力和储能/其他合计'; });
      if (prod.length) {
        var latest = prod[prod.length - 1];
        cards.push({ label: '电池产量 · ' + latest.record_date,
          value: latest.value.toFixed(1) + ' GWh',
          sub: latest.yoy ? '同比 ' + (latest.yoy > 0 ? '+' : '') + (latest.yoy * 100).toFixed(1) + '%' : '',
          trend: (latest.yoy || 0) >= 0 ? 'up' : 'down' });
      }
    }
    if (d.h2_project_status) {
      var tot = d.h2_project_status.reduce(function (s, r) { return s + r.count; }, 0);
      var inv = d.h2_project_status.reduce(function (s, r) { return s + r.total_investment; }, 0);
      cards.push({ label: '氢能项目库', value: tot + ' 个', sub: '总投资 ' + inv.toFixed(0) + ' 亿元', trend: 'up' });
    }
    if (d.recent_events) {
      cards.push({ label: '产业资讯', value: d.recent_events.length + '+', sub: '近期收录事件', trend: 'up' });
    }
    document.getElementById('metrics-grid').innerHTML = cards.map(function (c) {
      return '<div class="metric-card"><div class="label">' + c.label + '</div>' +
        '<div class="value">' + c.value + '</div>' +
        '<div class="sub"><span class="trend-' + c.trend + '">' + c.sub + '</span></div></div>';
    }).join('');
  }

  function renderIndustry(meta, ov) {
    var tc = {};
    (meta.table_counts || []).forEach(function (r) { tc[r.t] = r.n; });
    var stats = {
      NEV: (tc.nev_manufacturer_sales || 0) + ' 条销量记录',
      BATTERY: (meta.metric_catalog ? meta.metric_catalog.filter(function (m) { return m.industry_id === 'BATTERY'; }).length : 0) + ' 个跟踪指标',
      PV: (tc.pv_material_prices || 0) + ' 条价格数据',
      H2: (tc.h2_projects || 0) + ' 个项目 · ' + (tc.h2_bids || 0) + ' 条招标'
    };
    document.getElementById('industry-grid').innerHTML = ['NEV', 'BATTERY', 'PV', 'H2'].map(function (id) {
      return '<a href="' + industryLinks[id] + '" class="industry-card">' +
        '<div class="ind-header"><div class="ind-icon">' + industryIcons[id] + '</div>' +
        '<div class="ind-name">' + industryNames[id] + '</div></div>' +
        '<div class="ind-desc">' + industryDesc[id] + '</div>' +
        '<div class="ind-stats">' + stats[id] + '</div></a>';
    }).join('');
  }

  function renderTimeline(events) {
    var box = document.getElementById('timeline');
    if (!events || !events.length) { box.innerHTML = '<div class="loading-text">暂无数据</div>'; return; }
    box.innerHTML = events.slice(0, 15).map(function (e) {
      return '<div class="timeline-item">' +
        '<div class="timeline-date">' + (e.event_date || '').slice(5) + '</div>' +
        '<span class="timeline-tag tag-' + e.industry_id + '">' + (industryNames[e.industry_id] || e.industry_id) + '</span>' +
        '<div class="timeline-content"><div class="timeline-title">' + e.title + '</div>' +
        (e.summary ? '<div class="timeline-summary">' + e.summary + '</div>' : '') +
        '</div></div>';
    }).join('');
  }
})();
</script>
</body>
</html>
